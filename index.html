<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Задачи и Идеи</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Sync Status Indicator -->
    <div id="syncStatus" class="sync-status">
        <span id="syncText">Синхронизировано</span>
    </div>

    <!-- Tasks View -->
    <div id="tasksView" class="view active">
        <div class="view-header">
            <h1>Задачи</h1>
        </div>

        <input type="date" id="dateSelector" class="date-selector">

        <div id="tasksContainer" class="tasks-container"></div>
    </div>

    <!-- Completed Tasks View -->
    <div id="completedView" class="view">
        <div class="view-header">
            <h1>Выполненные</h1>
        </div>

        <div id="completedTasksContainer" class="tasks-container"></div>
    </div>

    <!-- Pomodoro View -->
    <div id="pomodoroView" class="view">
        <div class="view-header">
            <h1>Помодоро</h1>
        </div>

        <div class="pomodoro-container">
            <svg class="progress-ring" width="280" height="280">
                <circle class="progress-ring-bg" cx="140" cy="140" r="120" />
                <circle class="progress-ring-progress" cx="140" cy="140" r="120" />
            </svg>
            <div class="pomodoro-content">
                <div id="pomodoroTime" class="pomodoro-time">25:00</div>
                <div id="pomodoroLabel" class="pomodoro-label">Работа</div>
            </div>
        </div>

        <div class="pomodoro-stats">
            <div class="stat-item">
                <div class="stat-label">Сессий завершено</div>
                <div id="completedSessions" class="stat-value">0</div>
            </div>
        </div>

        <div class="pomodoro-controls">
            <button id="pomodoroStart" class="btn-primary">Старт</button>
            <button id="pomodoroReset" class="btn-secondary">Сброс</button>
        </div>
    </div>

    <!-- Ideas View -->
    <div id="ideasView" class="view">
        <div class="view-header">
            <h1>Идеи</h1>
        </div>

        <div id="ideasContainer" class="ideas-container"></div>
    </div>

    <!-- Floating Action Button -->
    <button id="addTaskBtn" class="fab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>

    <button id="addIdeaBtn" class="fab" style="display: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7z"></path>
            <path d="M9 21h6"></path>
        </svg>
    </button>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-view="tasks">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 11l3 3L22 4"></path>
                <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
            </svg>
            <span>Задачи</span>
        </button>

        <button class="nav-item" data-view="completed">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Выполненные</span>
        </button>

        <button class="nav-item" data-view="pomodoro">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>Помодоро</span>
        </button>

        <button class="nav-item" data-view="ideas">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7z"></path>
            </svg>
            <span>Идеи</span>
        </button>
    </nav>

    <!-- Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Добавить задачу</h2>
                <button id="closeTaskModal" class="close-btn">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="taskTitle" class="form-input" placeholder="Название задачи">
                </div>
                <div class="form-group">
                    <label>Дата</label>
                    <input type="date" id="taskDate" class="form-input">
                </div>
                <div class="form-group">
                    <label>Время (необязательно)</label>
                    <input type="time" id="taskTime" class="form-input">
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelTask" class="btn-secondary">Отмена</button>
                <button id="saveTask" class="btn-primary">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Idea Modal -->
    <div id="ideaModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Добавить идею</h2>
                <button id="closeIdeaModal" class="close-btn">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Название идеи</label>
                    <input type="text" id="ideaTitle" class="form-input" placeholder="Название">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="ideaDescription" class="form-input" rows="3" placeholder="Опишите идею"></textarea>
                </div>
                <div class="form-group">
                    <label>Как реализовать</label>
                    <textarea id="ideaImplementation" class="form-input" rows="4" placeholder="План реализации"></textarea>
                </div>
                <div class="form-group">
                    <label>Статус</label>
                    <select id="ideaStatus" class="form-input">
                        <option value="new">Новая</option>
                        <option value="in-progress">В процессе</option>
                        <option value="implemented">Реализована</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelIdea" class="btn-secondary">Отмена</button>
                <button id="saveIdea" class="btn-primary">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- App Script -->
    <script src="app.js"></script>

    <script>
        // Show/hide appropriate FAB based on view
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const view = item.dataset.view;
                document.getElementById('addTaskBtn').style.display = 
                    (view === 'tasks' || view === 'completed') ? 'flex' : 'none';
                document.getElementById('addIdeaBtn').style.display = 
                    view === 'ideas' ? 'flex' : 'none';
            });
        });
    </script>
</body>
</html>
